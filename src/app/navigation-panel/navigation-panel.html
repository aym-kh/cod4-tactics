<aside
  class="z-2 flex h-full flex-col gap-8 border-r border-[#303133] bg-[linear-gradient(145deg,#202122,#161718_68%)] px-4 py-5"
  id="navigation-panel" aria-label="Primary navigation">
  <a class="flex flex-col items-center justify-center gap-0.5 text-inherit no-underline cursor-pointer" routerLink="/"
    aria-label="COD4 Tactics home">
    <span class="text-[2.35rem] font-extrabold leading-none tracking-[-0.13em] text-[#f3f3f3]">C4T</span>
    <span class="text-[0.72rem] font-bold tracking-[0.035em] text-[#a6a7a8]">COD4 TACTICS</span>
    <span class="text-[0.62rem] font-semibold tracking-[0.04em] text-[#6b6d6f]" aria-label="App version">{{ appVersion
      }}</span>
  </a>

  <nav class="grid content-start gap-1">
    <h2 class="text-xs font-semibold uppercase tracking-[0.035em] text-[#96989a]" id="maps-heading">Maps</h2>

    @for (item of mapsList; track $index) {
    <button class="map-button" [class.is-selected]="item === selectedMap()"
      [attr.aria-current]="item === selectedMap() ? 'true' : null" (click)="selectMap($any(item))" type="button">
      <span class="capitalize">{{item}}</span>
    </button>
    }
  </nav>

  <footer class="mt-auto flex flex-col gap-3 pt-6">
    <span class="text-xs font-semibold uppercase tracking-[0.035em] text-[#96989a]">Community</span>
    <ul class="flex justify-center gap-2 p-0" aria-label="Social links">
      @for (link of socialLinks; track link.label) {
      <li>
        <a class="nav-social-link grid size-9 place-items-center rounded-md border border-[#414244] bg-[#1c1d1e] text-[#a6a7a8]"
          [href]="link.href" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label"
          [attr.title]="link.label">
          @if (link.label === 'X (Twitter)') {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"
            aria-hidden="true">
            <path
              d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.938l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z" />
          </svg>
          } @else if (link.label === 'LinkedIn') {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"
            aria-hidden="true">
            <path
              d="M0 1.146C0 .513.526 0 1.175 0h13.65C15.474 0 16 .513 16 1.146v13.708c0 .633-.526 1.146-1.175 1.146H1.175C.526 16 0 15.487 0 14.854zm4.943 12.248V6.169H2.542v7.225zm-1.2-8.212c.837 0 1.358-.553 1.358-1.248-.015-.709-.52-1.248-1.342-1.248S2.4 3.226 2.4 3.934c0 .695.521 1.248 1.327 1.248zm4.908 8.212V9.359c0-.216.016-.432.08-.586.173-.431.568-.878 1.232-.878.869 0 1.216.662 1.216 1.634v3.525h2.401V9.25c0-2.22-1.184-3.252-2.764-3.252-1.274 0-1.845.7-2.165 1.193v.025h-.016l.016-.025V6.169h-2.4c.03.678 0 7.225 0 7.225z" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"
            aria-hidden="true">
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8" />
          </svg>
          }
        </a>
      </li>
      }
    </ul>
  </footer>
</aside>
