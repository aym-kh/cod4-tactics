<div class="grid h-full grid-cols-[220px_minmax(0,1fr)] overflow-hidden bg-[#101112] text-[#f4f4f4]">

  <app-navigation-panel class="block" [selectedMap]="selectedMap()" (mapSelected)="selectedMap.set($event)" />

  <div class="grid h-screen grid-cols-[minmax(0,1fr)_300px]">
    <app-map-workspace [mapAsset]=" mapAsset()" [mapName]="selectedMap()"
      (lineupSelected)="selectedLineup.set($event)" />
    <app-details-panel class="block" [lineup]="selectedLineup()" />
  </div>

  <app-tactic-editor [mapName]="selectedMap()" />
</div>
